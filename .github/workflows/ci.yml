name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  HUSKY: 0

jobs:
  checks:
    name: Lint, types, unit tests, i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm i18n:check
      - run: pnpm worker:build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

  integration:
    name: Integration tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: perfume
          POSTGRES_PASSWORD: perfume
          POSTGRES_DB: perfume_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U perfume" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://perfume:perfume@localhost:5432/perfume_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: E2E (Playwright, vi + en)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: perfume
          POSTGRES_PASSWORD: perfume
          POSTGRES_DB: perfume
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U perfume" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://perfume:perfume@localhost:5432/perfume
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-used-anywhere-else
      INTERNAL_API_SECRET: ci-only-internal-api-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      # GitHub's Ubuntu runners ship Google Chrome: no browser download or apt step
      # (avoids flaky apt mirrors and saves ~5 minutes).
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
